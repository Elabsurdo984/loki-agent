name: ⚡ LOKI CI — Quality, Testing & Chaos Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🔍 Lint & Code Standards (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚡ Run Ruff Linter
        uses: astral-sh/ruff-action@v3
        with:
          args: "check src tests"

  chaos-gate:
    name: 🌪️ Synthetic Chaos & Rule Verification (Playground)
    runs-on: ubuntu-latest
    needs: [lint]
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 🚀 Start local testbed web application
        run: |
          python -m http.server 8000 --directory playground &
          sleep 2

      - name: ⚡ Execute LOKI Swarm Chaos Gate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CI: "true"
        run: |
          python -m src.loki.cli run http://localhost:8000 --swarm --duration 6 --ci

      - name: 📦 Archive LOKI Incident Bundles & HTML Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loki-evidence-bundles
          path: .loki/runs/
          retention-days: 14
