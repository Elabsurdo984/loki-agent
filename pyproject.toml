[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loki-chaos-agent"
dynamic = ["version"]
description = "Autonomous AI Testing & Synthetic Chaos Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Elabsurdo984" }
]
keywords = [
    "testing",
    "chaos-engineering",
    "playwright",
    "ai-agent",
    "qa",
    "synthetic-testing",
    "quality-assurance",
    "devops"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "shellingham>=1.5.4",
    "playwright>=1.45.0",
    "pyyaml>=6.0.1",
    "litellm>=1.40.0",
    "pillow>=10.0.0",
    "prompt_toolkit>=3.0.36",
    "psutil>=5.9.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
loki = "loki.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]


[tool.setuptools.dynamic]
version = { attr = "loki.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["loki*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (syntax, undefined variables, unused imports)
    "B",   # flake8-bugbear (common bug and design pitfalls)
]
ignore = [
    "E501", # Line length (prompts, long CLI messages and tables)
    "B008", # Function calls in argument defaults (Typer standard pattern)
    "E402", # Module level import not at top (early sys.stdout.reconfigure / litellm setup)
    "B904", # raise ... from err (Typer typer.Exit patterns)
    "B027", # Empty default methods in BasePersona ABC
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "B018", "B023"]
